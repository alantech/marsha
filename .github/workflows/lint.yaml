name: Lint project

on:
  pull_request:
    branches: [main]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.client_payload.ref }}
      - name: Set up Python 3.14
        uses: actions/setup-python@v4
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install uv
      - name: Lint project
        run: |
          uv venv venv
          uv pip install --python ./venv/bin/python .
          PEP8_LINT_RESULTS=`./venv/bin/autopep8 -d marsha/*.py marsha/personas/*.py`
          if [ "$PEP8_LINT_RESULTS" != '' ]; then
            echo $PEP8_LINT_RESULTS
            exit 1
          fi
          FLAKE8_LINT_RESULTS=`./venv/bin/flake8 marsha/*.py marsha/personas/*.py`
          if [ "$FLAKE8_LINT_RESULTS" != '' ]; then
            echo $FLAKE8_LINT_RESULTS
            exit 1
          fi
            