name: Watchman eval

# The review watchman (Iris) clears a prior finding only when the archivist's own record shows a
# permitted basis. This job runs the watchman over 60 example clearances (30 honestly supported,
# 30 not) and fails when it decides too few of them correctly. The threshold (90) is a floor that
# is meant to be ratcheted up over time as the persona earns trust, so a small number of
# borderline calls never blocks a merge while a regressing watchman does.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      threshold:
        description: "Fail when fewer than this % of fixtures are decided correctly"
        required: false
        default: 90
      n_jobs:
        description: "Number of fixtures evaluated in parallel"
        required: false
        default: 8

jobs:
  run-openai:
    name: Watchman eval (OpenAI)
    runs-on: ubuntu-latest
    outputs:
      results: ${{ steps.run.outputs.results }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.14
        uses: actions/setup-python@v4
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install uv
      - name: Run watchman eval
        id: run
        run: |
          # The workflow_dispatch inputs are untrusted: validate they are plain integers BEFORE
          # they reach the shell (a non-numeric value, e.g. a newline + command, fails here rather
          # than running with the API secret present). They are then passed as quoted arguments.
          case "$N_JOBS" in ''|*[!0-9]*) echo "n_jobs must be a positive integer, got: $N_JOBS"; exit 1;; esac
          case "$THRESHOLD" in ''|*[!0-9]*) echo "threshold must be an integer, got: $THRESHOLD"; exit 1;; esac
          make watchman-eval provider=openai n_jobs="$N_JOBS" threshold="$THRESHOLD"
          results=$(echo $(cat watchman_eval_results.md) | tr '\n' ' ' | sed "s/# Watchman eval results //")
          echo "results=$results" >> "$GITHUB_OUTPUT"
        env:
          N_JOBS: ${{ github.event.inputs.n_jobs || 8 }}
          THRESHOLD: ${{ github.event.inputs.threshold || 90 }}
          OPENAI_SECRET_KEY: ${{ secrets.OPENAI_SECRET_KEY }}
      - name: Show results
        if: ${{ always() }}
        run: cat watchman_eval_results.md
