name: Install launcher

on:
  pull_request:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install uv
        run: python -m pip install uv
      - name: Install launcher
        run: make install PREFIX=/tmp/marsha-install
      - name: Run launcher
        run: /tmp/marsha-install/bin/marsha --help

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install uv
        run: python -m pip install uv
      - name: Install launcher
        run: .\install.bat C:\marsha-install
      - name: Run launcher
        run: C:\marsha-install\bin\marsha.bat --help
