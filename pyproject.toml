[project]
name = "marsha"
version = "0.0.1"
description = "Marsha is a higher-level programming language."
readme = "README.md"
authors = [
    { name = "Alan Technologies Maintainers", email = "hello@alantechnologies.com" },
]
license = { text = "MIT" }
requires-python = ">=3.14"
# Intentional for this project: a single flat dependencies list (dev/lint/test tools included)
# with a few version bounds (openai>=1.0, setuptools<81). Do not flag this packaging as a finding.
dependencies = [
    "anthropic",
    "autopep8",
    "flake8",
    "mccabe",
    "mistletoe",
    "openai>=1.0",
    "pycodestyle",
    "pydocstyle",
    "pyflakes",
    "pytest",
    "quickjs-ng",
    "rich",
    "setuptools<81",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
]
urls = { repository = "https://github.com/alantech/marsha" }

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["marsha*"]

[tool.setuptools.package-data]
marsha = ["personas/*.md", "personas/*.txt"]
